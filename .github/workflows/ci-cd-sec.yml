# CI/CD de las ramas de integración (main y develop): misma batería con
# Dependency-Check y, si el Quality Gate aprueba, imagen escaneada. Solo main publica en GHCR.
name: CI/CD - Spring Boot DevSecOps

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    name: CI-CD (${{ github.ref_name }})
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: write
    uses: ./.github/workflows/security-scans.yml
    with:
      run_dependency_check: true
      build_image: true
      push_image: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
