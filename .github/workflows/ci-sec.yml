# CI de seguridad para ramas de trabajo y pull requests (spec ci-workflows CIW-01, CIW-02).
# Toda la batería vive en security-scans.yml; aquí solo se definen disparadores y permisos.
name: CI - Spring Boot DevSecOps

on:
  push:
    branches: ['feature/**', 'bugfix/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancela las ejecuciones obsoletas de la misma rama o PR (CIW-13).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    # El check resultante se llama "CI (<evento>) / <job>", p. ej. "CI (pull_request) / Quality Gate".
    name: CI (${{ github.event_name }})
    # Un reutilizable solo puede reducir permisos: el caller concede el máximo que necesita.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security-scans.yml
    with:
      # Dependency-Check en PR; en push a feature/** el SCA rápido es Trivy sobre el SBOM.
      run_dependency_check: ${{ github.event_name == 'pull_request' }}
      build_image: false
      push_image: false
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
