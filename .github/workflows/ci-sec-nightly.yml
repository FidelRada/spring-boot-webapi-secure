# Nightly con SCA: todos los días a las 20:55 hora de Bolivia
# (America/La_Paz, UTC-4 sin horario de verano = 55 0 * * * UTC) y bajo demanda.
# Escanea también la imagen, sin publicarla. Sin cancelación por concurrencia.
name: CI - Nightly - Spring Boot DevSecOps

on:
  schedule:
    - cron: '55 20 * * *'
      timezone: America/La_Paz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seguridad:
    name: Nightly
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security-scans.yml
    with:
      run_dependency_check: true
      build_image: true
      push_image: false
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
