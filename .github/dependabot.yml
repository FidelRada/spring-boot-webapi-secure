# Actualizaciones de versiones de Dependabot (spec SCA-09, guía 02 §11).
# Las alertas y las actualizaciones de seguridad se habilitan aparte en Settings → Code security
# (SCA-11); el secreto NVD_API_KEY también se registra para Dependabot.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencias, seguridad]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencias, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencias, contenedor]
