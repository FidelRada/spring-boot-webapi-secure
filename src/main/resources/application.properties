spring.application.name=springboot-devsecops-lab

spring.datasource.url=jdbc:h2:mem:devsecopsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

spring.sql.init.mode=always

# LAB: configuracion deliberadamente insegura.
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
server.error.include-message=always
server.error.include-stacktrace=always

# Credencial ficticia. Nunca utilizar valores reales en este repositorio.
lab.external.api-key=LAB-DEMO-KEY-7f91c2a4-insecure

# Hashes bcrypt de los usuarios del laboratorio, solo por variables de entorno.
lab.security.admin-password-hash=${LAB_ADMIN_PASSWORD_HASH:}
lab.security.user-password-hash=${LAB_USER_PASSWORD_HASH:}
