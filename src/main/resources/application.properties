spring.application.name=springboot-devsecops-lab

spring.datasource.url=jdbc:h2:mem:devsecopsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always

# Configuración endurecida (change remediate-app-vulnerabilities, design.md D6).
# Consola H2 deshabilitada.
spring.h2.console.enabled=false
# Actuator: solo health (público) e info; sin valores de entorno ni detalles.
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=never
management.endpoint.health.show-details=never
# Respuestas de error sin mensaje interno, stacktrace ni errores de binding.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Credencial externa: solo por variable de entorno, nunca en el repositorio.
lab.external.api-key=${LAB_EXTERNAL_API_KEY:}

# Hashes bcrypt de los usuarios del laboratorio, solo por variables de entorno.
lab.security.admin-password-hash=${LAB_ADMIN_PASSWORD_HASH:}
lab.security.user-password-hash=${LAB_USER_PASSWORD_HASH:}
